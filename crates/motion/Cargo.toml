[package]
name = "motion"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Time-injected motion math: easing curves, springs, tweens, motion roles, loaders, and reduced-motion policy"

[lints]
workspace = true

[lib]
path = "src/motion.rs"
doctest = false

[features]
default = []
serde = ["dep:serde"]
schemars = ["dep:schemars", "serde"]

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "sampling"
harness = false
